general {
    col.active_border = rgba(948f99AA)
    col.inactive_border = rgba(49454eAA)
}

misc {
    background_color = rgba(141218FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(141218FF)
        col.text = rgba(e6e0e8FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e6e0e8), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e6e0e8), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e6e0e8), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

# pinned
windowrulev2 = bordercolor rgba(d1bcfeAA) rgba(d1bcfe77),pinned:1

# fullscreen
windowrulev2 = bordercolor rgba(8CD2F3AA), fullscreen:1
windowrulev2 = bordersize 3, fullscreen:1