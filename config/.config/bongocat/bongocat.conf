# ═══════════════════════════════════════════════════════════════════════════
# BONGO CAT CONFIG - Minimal defaults, uncomment to customize
# ═══════════════════════════════════════════════════════════════════════════

# Position & Size
# cat_height=50
# cat_align=center
# cat_x_offset=700
# cat_y_offset=-8

cat_height=40
cat_align=center
cat_x_offset=720
cat_y_offset=-6

# Appearance
enable_antialiasing=1
overlay_height=80
overlay_opacity=0
overlay_position=top
# mirror_x=0
# mirror_y=0

# Input device (run bongocat-find-devices to find yours)
keyboard_name=Kingston HyperX Alloy Origins Core

# Multi-monitor (comma-separated monitor names)
monitor=DP-1,DP-2,DP-3

# Sleep mode (optional)
idle_sleep_timeout=120